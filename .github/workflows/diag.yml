name: letao-diag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: reproduce pull --rebase fork scenario
        run: |
          git config user.name "diag-bot"
          git config user.email "bot@users.noreply.github.com"
          echo "diag2 $(date -u +%H:%M:%S)" >> monitor/heartbeat
          git add monitor/heartbeat
          git commit -m "diag2: local commit [skip ci]" || echo "commit failed rc=$?"
          echo "=== before pull: log ==="
          git log --oneline -2
          echo "=== status before pull ==="
          git status --short
          echo "=== waiting 45s for external trigger commit ==="
          sleep 45
          echo "=== pull --rebase (capture all) ==="
          git pull --rebase origin main
          echo "pull exit=$?"
          echo "=== status after pull ==="
          git status --short
          echo "=== log after pull ==="
          git log --oneline -4
