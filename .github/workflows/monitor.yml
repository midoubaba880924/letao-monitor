name: letao-monitor

on:
  schedule:
    - cron: "*/5 * * * *"    # 每5分钟一轮（公开仓库免费不限量）
  workflow_dispatch:
    inputs:
      test_item:
        description: "测试商品URL(goods_detail链接)，留空=正常监控"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: letao-monitor
  cancel-in-progress: true   # 同一时刻只跑一个实例，防止重复推送

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run monitor
        env:
          LETAO_TOKEN: ${{ secrets.LETAO_TOKEN }}
          STATE_DIR: ${{ github.workspace }}/monitor
          TEST_ITEM: ${{ github.event.inputs.test_item }}
        run: python monitor/letao_monitor.py

      - name: Send notification
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
        run: python monitor/notify.py monitor/alerts.json

      - name: Commit state
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add monitor/seen_items.json monitor/alerts.log || true
          git diff --cached --quiet || git commit -m "chore: update monitor state [skip ci]"
          git push
