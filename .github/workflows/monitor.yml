name: letao-monitor

on:
  schedule:
    - cron: "30 22 * * *"   # UTC 22:30 = 北京 6:30（凌晨停跑窗口结束）
    - cron: "30 4 * * *"    # UTC 4:30 = 北京 12:30（第二段接力）
    - cron: "30 10 * * *"   # UTC 10:30 = 北京 18:30（第三段接力）
  workflow_dispatch:
    inputs:
      test_item:
        description: "测试商品URL(goods_detail链接)，留空=正常监控"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: letao-monitor
  cancel-in-progress: false   # 撞车时排队串行：cron 新 run 排队等待旧 run 结束，无缝接力

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360      # job 上限 6h；脚本 5h59m 主动退出，避免被强杀
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 强制最新 main（含上一段 run 刚 push 的状态），避免旧快照重复推送
          fetch-depth: 0   # 完整历史：浅克隆下 run_loop 每轮 git pull --rebase 会因历史缺失报错(128)致心跳推不出去

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run long-lived monitor loop (2-min rounds)
        env:
          LETAO_TOKEN: ${{ secrets.LETAO_TOKEN }}
          STATE_DIR: ${{ github.workspace }}/monitor
          TEST_ITEM: ${{ github.event.inputs.test_item }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
        run: python monitor/run_loop.py
