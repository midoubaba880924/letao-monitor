name: letao-monitor-watchdog

on:
  schedule:
    - cron: "*/5 * * * *"   # 每5分钟检查主 run 存活（轻量，调度延迟不影响主链路）

permissions:
  contents: read
  actions: write   # 需要 workflow_dispatch 补触发主工作流

concurrency:
  group: letao-monitor-watchdog
  cancel-in-progress: true   # watchdog 每次只查一次，旧轮可直接取消

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check main run alive and recover if stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: python monitor/watchdog.py
