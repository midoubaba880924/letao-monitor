name: letao-monitor-b

on:
  schedule:
    - cron: "2-59/5 * * * *"   # 错峰轮：在 2/7/12/17... 分触发，与 A 组合成每2.5分钟一轮
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: letao-monitor
  cancel-in-progress: false   # 撞车时排队串行，不丢轮次

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 强制最新 main，避免 run 创建时固定的旧快照（github.sha）导致重复推送

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stagger 150s offset from workflow A
        run: sleep 150   # 运行时错峰：GitHub cron 分钟错峰不可靠（实际曾同分钟撞车），改为 job 内延时

      - name: Run monitor
        env:
          LETAO_TOKEN: ${{ secrets.LETAO_TOKEN }}
          STATE_DIR: ${{ github.workspace }}/monitor
        run: python monitor/letao_monitor.py

      - name: Send notification
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
        run: python monitor/notify.py monitor/alerts.json

      - name: Commit state
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add monitor/seen_items.json monitor/alerts.log || true
          git diff --cached --quiet || git commit -m "chore: update monitor state [skip ci]"
          git push || true   # 撞车失败不阻塞，下轮会重写
